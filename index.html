<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godzinaki</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica;
      font-size: 16px;
      align-items: center;
      justify-content: center;
      display: flex;
      background: linear-gradient(to bottom, #39c6f6 0%, #BAE9FC 100%);
    }

    .grid {
      display: grid;
      grid-template-rows: 36% 22% 26% 1fr auto;
      position: relative;
      aspect-ratio: 21 / 9;
      height: 100vh;
      min-height: 320px;
      min-width: 280px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .bg_top {
      position: absolute;
      inset: 0;
      grid-row: 1/1;
      background-image: url('assets/bg/wide_top.svg');
      background-size: cover;
      background-position: bottom;
      background-repeat: no-repeat;
      z-index: -1;
      pointer-events: none;
    }

    .bg_btm {
      position: absolute;
      inset: 0;
      grid-row: 3/3;
      background-image: url('assets/bg/wide_btm.svg');
      background-size: cover;
      background-position: top;
      background-repeat: no-repeat;
      z-index: -1;
      pointer-events: none;
    }

    .img-logo {
      height: auto;
      max-height: 70%;
      min-height: 100px;
    }

    .row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3e95c9;
    }

    .row-slogan {
      background-color: white;
      color: #3e95c9;
      font-size: clamp(0.5rem, 7vw, 8rem);
      font-family: 'Fredoka One', Arial;
      white-space: nowrap;
      overflow: hidden;
      margin-top: -2px;
      margin-bottom: -2px;
      user-select: none;
      pointer-events: none;
    }

    .row-copyright {
      font-size: 1rem;
      font-family: Arial, Helvetica;
      margin: 5px;
      white-space: nowrap;
      overflow: hidden;
    }

    @media (max-aspect-ratio: 1/1) {
      .grid {
        grid-template-rows: 26% 16% 20% 1fr auto;
        min-height: 420px;
        min-width: 280px;
      }
      .bg_top {
        background-image: url('assets/bg/square_top.svg');
      }
      .bg_btm {
        background-image: url('assets/bg/square_btm.svg');
      }
      .row-slogan {
        font-size: clamp(0.5rem, 8vw, 6rem);
      }
    }

    @media (max-aspect-ratio: 10/16) {
      .grid {
        grid-template-rows: 20% 12% 16% 1fr auto;
        min-height: 480px;
        min-width: 320px;
      }
      .bg_top {
        background-image: url('assets/bg/port_top.svg');
      }
      .bg_btm {
        background-image: url('assets/bg/port_btm.svg');
      }
      .row-slogan {
        font-size: clamp(0.5rem, 10vw, 10rem);
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="bg_top"></div>
    <div class="bg_btm"></div>
    <div class="row">
      <img class="img-logo" src="assets/head_logo_gozinaki.png" alt="Loading...">
    </div>
    <div class="row row-slogan">Taste the fun!</div>
    <div class="row"></div>
    <div class="row"></div>
    <div class="row row-copyright">
      Gozinaki.Team 2025 | Made with sweet love
    </div>
  </div>
</body>
</html>
