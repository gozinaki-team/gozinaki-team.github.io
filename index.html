<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godzinaki</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      font-size: 16px;
      align-items: center;
      justify-content: center;
      display: flex;
      background: linear-gradient(to bottom, #39c6f6 0%, #BAE9FC 100%);
    }

    .grid {
      display: grid;
      grid-template-rows: 22% 28% 25% auto auto;
      position: relative;
      aspect-ratio: 21 / 9;
      height: 100vh;
      min-height: 340px;
      min-width: 280px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    
    .bg_mountain {
      position: absolute;
      inset: 0;
      grid-row: 1 / 4;
      background-image: url('assets/1920_landscape.svg');
      background-size: cover;
      background-position: bottom;
      background-repeat: no-repeat;
      z-index: -1;
      pointer-events: none;
    }

    @media (max-aspect-ratio: 2/1) {
      .grid {grid-template-rows: 35% 20% 25% auto auto}
    }    

    .row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3e95c9;
      font-size: clamp(0.5rem, 8vw, 8rem);
      
      font-family: 'Fredoka One', Arial;
      white-space: nowrap;
      overflow: hidden;
    }

    .row-copyright {
      font-size: 1rem;
      font-family: Arial, Helvetica;
    }

  </style>
</head>
<body>
  
    <div class="grid">
        <div class="bg_mountain"></div>
    
        <div class="row" >
            <img 
                src="assets/head_logo_gozinaki.png" 
                alt="Gozinaki Team Logo" 
                style="height: auto; max-height: 15vh; min-height: 100px;">
        </div>
        <div class="row">Taste the fun!</div>
        <div class="row"></div>
        <div class="row"></div>
        <div class="row row-copyright">Gozinaki.Team 2025 | Made with sweet love</div>
  </div>

</body>
</html>
